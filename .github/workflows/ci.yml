name: Kursplan CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  review:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.15'
      - name: Check Python source
        run: |
          python -m pip install ruff==0.15.12
          python -m ruff check --target-version py312 --select E9,F63,F7,F82 --output-format github .
      - name: Check JavaScript syntax and course catalog JSON
        run: |
          git ls-files -z -- '*.js' | xargs -0 -r -n 1 node --check
          python -m json.tool utbildningar.json > /dev/null
      - name: Check GitHub Actions workflows
        run: >-
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check changed dependencies
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          retry-on-snapshot-warnings: true

  tests:
    name: Pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - name: Install dependencies and Chromium
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip check
          python -m playwright install --with-deps chromium
      - name: Run PostgreSQL, SQLite and browser tests
        run: >-
          python -m pytest --cov --cov-report=term-missing --cov-report=xml:coverage.xml
          --junitxml=pytest.xml --tracing=retain-on-failure
      - name: Upload test report and browser traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-python-${{ matrix.python }}
          path: |
            pytest.xml
            coverage.xml
            test-results/
          overwrite: true
          retention-days: 7
      - name: Check Codacy configuration
        if: matrix.python == '3.12'
        id: codacy
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          if [[ -n "$CODACY_PROJECT_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CODACY_PROJECT_TOKEN saknas; coverage.xml sparas som artefakt."
          fi
      - name: Upload coverage report to Codacy
        if: steps.codacy.outputs.enabled == 'true'
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.xml
          language: Python

  container:
    name: Build and test production image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: kursplan-ci
      KURSPLAN_IMAGE: kursplan:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build and test with the production updater, including image rollback
        env:
          PREVIOUS_RELEASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from uuid import uuid4

          from update import REVISION_LABEL, build_and_test, export_source, run

          revision = os.environ["GITHUB_SHA"]
          previous_revision = os.environ["PREVIOUS_RELEASE_SHA"]
          if not previous_revision or previous_revision in {"0" * 40, revision}:
              raise SystemExit("Föregående version saknas för återställningsprovet.")
          try:
              run("git", "rev-parse", "--verify", f"{previous_revision}^{{commit}}", capture=True)
          except subprocess.CalledProcessError:
              raise SystemExit("Föregående version saknas i den hämtade Git-historiken.") from None

          with TemporaryDirectory(prefix="kursplan-ci-") as directory:
              root = Path(directory)
              source = root / "source"
              previous_source = root / "previous-source"
              export_source(revision, source)
              export_source(previous_revision, previous_source)
              previous_tag = f"kursplan:ci-previous-{uuid4().hex}"
              run(
                  "docker", "build", "--pull", "--label", f"{REVISION_LABEL}={previous_revision}",
                  "--tag", previous_tag, "--file", str(previous_source / "dockerfile"), str(previous_source),
              )
              try:
                  previous_image = run("docker", "image", "inspect", "--format", "{{.Id}}", previous_tag, capture=True)
                  build_and_test(source, revision, previous_image=previous_image)
              finally:
                  subprocess.run(("docker", "image", "rm", previous_tag), check=False)
          PY
      - name: Prepare an isolated Compose stack
        id: compose
        run: |
          umask 077
          cat > .env <<EOF
          DEV_MODE=false
          send_mail=0
          app_secret_key=$(openssl rand -hex 24)
          db_password=$(openssl rand -hex 24)
          test_email=ci-admin@example.invalid
          test_password=$(openssl rand -hex 24)
          EOF
          docker compose config --quiet
          docker compose --profile true config --quiet
          docker network create jk_tunnel_net
      - name: Run the exact image with the production Compose file
        run: |
          web_image=$(docker compose config --format json | jq -er '.services.web.image // (.name + "-web")')
          docker image tag "$KURSPLAN_IMAGE" "$web_image"
          docker compose up -d --wait --wait-timeout 120 db
          docker compose up -d --no-deps --no-build --pull never --wait --wait-timeout 120 web
          test "$(docker inspect --format '{{.Image}}' "$(docker compose ps -q web)")" = \
            "$(docker image inspect --format '{{.Id}}' "$KURSPLAN_IMAGE")"
          python3 -c 'from update import verify_database; verify_database()'
      - name: Verify routes, static files and PostgreSQL login over the tunnel network
        run: >-
          docker run --rm --interactive --network jk_tunnel_net --env-file .env
          --entrypoint python "$KURSPLAN_IMAGE" - < tests/release_smoke.py
      - name: Show Compose status and logs on failure
        if: failure() && steps.compose.outcome == 'success'
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 100
      - name: Remove CI stack
        if: always() && steps.compose.outcome == 'success'
        run: |
          docker compose down --volumes
          if docker network inspect jk_tunnel_net > /dev/null 2>&1; then
            docker network rm jk_tunnel_net
          fi

  release-gate:
    name: Release gate
    if: ${{ always() }}
    needs: [review, dependency-review, tests, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      STATIC_RESULT: ${{ needs.review.result }}
      DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
      TEST_RESULT: ${{ needs.tests.result }}
      CONTAINER_RESULT: ${{ needs.container.result }}
    steps:
      - name: Require every applicable check to pass
        run: |
          printf 'Static checks: %s\nDependency review: %s\nPytest: %s\nContainer: %s\n' \
            "$STATIC_RESULT" "$DEPENDENCY_RESULT" "$TEST_RESULT" "$CONTAINER_RESULT"
          test "$STATIC_RESULT" = success
          test "$TEST_RESULT" = success
          test "$CONTAINER_RESULT" = success
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            test "$DEPENDENCY_RESULT" = success
          else
            test "$DEPENDENCY_RESULT" = skipped
          fi
