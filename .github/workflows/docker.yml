name: Test Docker image

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    name: Build test Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          tags: kursplan:test
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create CI Docker network
        run: docker network create kursplan-ci

      - name: Start PostgreSQL
        run: >-
          docker run --detach --name kursplan-db-test
          --network kursplan-ci
          --env POSTGRES_PASSWORD=ci-test-password
          --env POSTGRES_DB=postgres
          postgres:18

      - name: Wait for PostgreSQL to be ready
        run: |
          for attempt in $(seq 1 30); do
            if docker exec kursplan-db-test pg_isready -U postgres -d postgres; then
              exit 0
            fi
            sleep 2
          done
          docker logs kursplan-db-test
          exit 1

      - name: Start container
        run: >-
          docker run --detach --name kursplan-test
          --network kursplan-ci
          --publish 8000:8000
          --env db_path=postgresql://postgres:ci-test-password@kursplan-db-test:5432/postgres
          --env app_port=8000
          --env app_secret_key=ci-test-secret
          --env test_email=ci@example.com
          --env test_password=ci-test-password
          kursplan:test
      - name: Check health endpoint
        run: >-
          curl --fail
          --retry 10
          --retry-delay 2
          --retry-all-errors
          http://127.0.0.1:8000/health
      
      - name: Show container status and logs on failure
        if: failure()
        run: |
          docker ps -a
          docker inspect kursplan-test || true
          docker logs kursplan-test || true
          docker logs kursplan-db-test || true

      - name: Remove test containers and network
        if: always()
        run: |
          docker rm --force kursplan-test || true
          docker rm --force kursplan-db-test || true
          docker network rm kursplan-ci || true