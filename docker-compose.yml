services:
  web:
    build:
      context: .
      dockerfile: dockerfile

    env_file:
      - .env

    environment:
      db_path: postgresql://postgres:${db_password:-password}@db:5432/postgres
      app_port: 8000
      LOG_DIR: /app/logs

    volumes:
      - app_logs:/app/logs

    depends_on:
      db:
        condition: service_healthy

    # Cloudflare Tunnel routes to http://kursplan:8000.
    # No public host port is needed.
    expose:
      - "8000"

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    develop:
      watch:
        - action: rebuild
          path: .
          ignore:
            - __pycache__/
            - .git/
            - .venv/
            - logs/

    networks:
      tunnel:
        aliases:
          - kursplan
      backend:


  db:
    image: postgres:18
    restart: unless-stopped

    environment:
      POSTGRES_PASSWORD: ${db_password:-password}

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - backend


  db-access:
    image: haproxy:3.2-alpine

    # COMPOSE_PROFILES follows DEV_MODE through .env. This service therefore
    # exists only when DEV_MODE=true.
    profiles:
      - "true"

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "127.0.0.1:5432:5432"

    configs:
      - source: db_access_haproxy
        target: /usr/local/etc/haproxy/haproxy.cfg

    restart: unless-stopped

    networks:
      - backend
      - db-access


networks:
  tunnel:
    external: true
    name: jk_tunnel_net
  backend:
    internal: true
  db-access:
    driver: bridge
  


volumes:
  postgres_data:
  app_logs:


configs:
  db_access_haproxy:
    content: |
      global
        log stdout format raw local0

      defaults
        log global
        mode tcp
        timeout connect 5s
        timeout client 1h
        timeout server 1h

      frontend postgres_frontend
        bind :5432
        default_backend postgres_backend

      backend postgres_backend
        server db db:5432 check
