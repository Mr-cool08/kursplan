services:
  web:
    build:
      context: .
      dockerfile: dockerfile

    env_file:
      - .env

    environment:
      db_path: postgresql://postgres:${db_password:-password}@db:5432/postgres
      app_port: 8000

    depends_on:
      db:
        condition: service_healthy

    # Cloudflare Tunnel routes to http://kursplan:8000.
    # No public host port is needed.
    expose:
      - "8000"

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    develop:
      watch:
        - action: rebuild
          path: .
          ignore:
            - __pycache__/
            - .git/
            - .venv/

    networks:
      tunnel:
        aliases:
          - kursplan
      backend:


  db:
    image: postgres:18

    environment:
      POSTGRES_PASSWORD: ${db_password:-password}


    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - backend


networks:
  tunnel:
    external: true
    name: jk_tunnel_net
  backend:
    internal: true
  


volumes:
  postgres_data: