services:
  web:
    build:
      context: .
      dockerfile: dockerfile
    env_file:
      - .env
    environment:
      db_path: /app/data/database.db
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - database-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  database-data: