services:
  web:
    build:
      context: .
      dockerfile: dockerfile
    env_file:
      - .env
    environment:
      db_path: /app/data/database.db
    ports:
      - "${app_port:-8000}:8000"
    volumes:
      - database-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:${app_port:-8000}/health')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    develop:
        watch:
          - action: sync
            path: .
            target: /app
            ignore:
              - __pycache__/
              - .git/
              - .venv/

          - action: rebuild
            path: requirements.txt

  db:
    image: postgres:18
    container_name: postgres-${environment:-dev}
    environment:
      POSTGRES_PASSWORD: ${db_password:-password}
    ports:
      - "${db_port:-54326}:54326"
    volumes:
      - postgres_data:/var/lib/postgresql



volumes:
  database-data:
  postgres_data: