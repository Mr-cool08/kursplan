{% extends "base.html" %}
{% block title %}Registrera{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='style/auth.css') }}">
{% endblock %}
{% block content %}
<h1>Registrera konto</h1>
{% if error %}<p style="color:red;">{{ error }}</p>{% endif %}
<form method="post">
  <label for="name">Namn:</label>
  <input type="text" id="name" name="name" required><br><br>
  <label for="email">E-post:</label>
  <input type="email" id="email" name="email" required><br><br>
  <label for="password">Lösenord:</label>
  <input type="password" id="password" name="password" required><br><br>
  <label class="checkbox-row">
    <input type="checkbox" onclick="showpassword()" name="show_password">
    <span>Visa lösenord</span>
  </label>
  <label for="organization_number">Organisationsnummer:</label>
  <input type="text" id="organization_number" name="organization_number" required><br><br>

  <input type="submit" value="Skapa konto">
</form>



<script>
  
  
  
function showpassword() {
  var x = document.getElementById("password");
  if (x.type === "password") {
    x.type = "text";
  } else {
    x.type = "password";
  }
}



</script>


{% endblock %}
